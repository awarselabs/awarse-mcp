[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "healwright"
version = "0.1.0"
description = "Autonomous self-healing Playwright test automation agent and MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Sean Kildunne", email = "skildunne@awarselabs.com" }
]
keywords = ["playwright", "testing", "mcp", "self-healing", "qa", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastmcp>=0.1.0",
    "playwright>=1.45.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.urls]
Homepage = "https://awarselabs.com"
Documentation = "https://awarselabs.com/docs/healwright"
Repository = "https://github.com/awarse-labs/healwright"

[project.scripts]
healwright = "healwright.cli:app"
healwright-mcp = "healwright.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/healwright"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
